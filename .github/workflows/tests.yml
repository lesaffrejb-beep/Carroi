name: tests

# Garde-fou R6 : un push qui casse la suite doit être visible immédiatement.
# La CI n'exécute QUE les tests (logique pure). Elle ne vérifie PAS le manifeste
# de données : le runner n'a pas data/interim/ (données hors git, sur SSD).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        # geopandas / pyogrio / rasterio / shapely fournissent des wheels
        # manylinux avec GDAL/GEOS embarqués : pas d'apt-get de libs système
        # nécessaire. Si un jour une wheel manque pour une version de Python,
        # ajouter ici :  sudo apt-get update && sudo apt-get install -y libgdal-dev
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run tests
        run: python -m pytest pipeline/tests/ -q
