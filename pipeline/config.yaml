# Configuration centrale du pipeline. Tout paramètre métier vit ici, pas dans le code.

dept: "49"                 # département cible (string, garde le zéro initial des DOM/Corse ailleurs)
crs_metric: "EPSG:2154"    # Lambert-93 : tous les calculs de surface/distance
crs_output: "EPSG:4326"    # WGS84 : lat/lon des exports

paths:
  raw: "data/raw"          # téléchargements bruts (gitignoré)
  interim: "data/interim"  # couches intermédiaires (parquet/gpkg)
  final: "data/final"      # base qualifiée interne
  exports: "data/exports"  # fichiers clients générés
  optout: "data/optout/optout.csv"   # adresses retirées (droit d'opposition) — filtre systématique
  validation: "data/validation"

bdortho:
  # Dossier contenant les archives 7z multi-volumes BD ORTHO (RVB + IRC) du
  # département — sur un disque externe HORS repo (~61 Go), donc dépendant de la
  # machine. Utilisé par 12_extraire_dalles_ortho.py. Laisser vide et passer
  # --archives-dir en argument, OU renseigner ici le chemin monté, ex. :
  #   archives_dir: "/Volumes/NOIR 1/maps-bdortho/D049_2022"
  archives_dir: ""

cosia:
  # Dossier des blocs GPKG CoSIA du département (24_candidats_cosia.py) — hors
  # repo (disque externe). Laisser vide et passer --cosia-dir, OU renseigner :
  #   gpkg_dir: "/Volumes/NOIR 1/maps-bdortho/COSIA_D049/2022/COSIA_1-0__GPKG_LAMB93_D049_2022-01-01"
  gpkg_dir: ""
  # Seuil bas de surface PROPRE à CoSIA (≠ piscines.surface_min_m2 qui reste
  # celui du détecteur v1) : une piscine couverte dont CoSIA ne voit qu'un coin
  # fait 2-6 m². Mesuré Bouchemaine 2026-08-06 : 3 m² → rappel 98,4 %.
  surface_min_m2: 3

piscines:
  # Filtres qualité — justifiés dans docs/06-QUALITE-VALIDATION.md.
  # Ajuster UNIQUEMENT après une passe de validation, et consigner l'ancien/nouveau dans 08-ROADMAP.md.
  surface_min_m2: 8
  surface_max_m2: 150
  dist_max_batiment_m: 60      # piscine sans bâtiment d'habitation à <60 m => exclue
  dist_max_adresse_m: 120      # adresse BAN retenue à plus de 120 m de la piscine => confiance basse
  chevauchement_parcelle_min: 0.6  # part min. de la piscine dans la parcelle retenue, sinon jointure ambiguë

detection:
  # Étape 1b (15_detect_piscines.py) — seuillage colorimétrique HSV + IRC, option B
  # de docs/04-PIPELINE-PISCINES.md. Seuils initiaux justifiés par la physique du
  # signal (eau de piscine = teinte cyan, forte absorption du proche infrarouge) ;
  # à calibrer sur la commune test (B2) et consigner tout changement dans 08-ROADMAP.md.
  hsv:
    hue_min: 0.42            # teinte (0-1) : fenêtre cyan-azur de l'eau traitée
    hue_max: 0.62
    sat_min: 0.15            # en dessous : gris/blanc (toits, routes)
    val_min: 0.25            # en dessous : ombres
  irc:
    band_nir: 1              # BD ORTHO IRC : bande 1 = proche infrarouge
    ndvi_max: 0.10           # (NIR-R)/(NIR+R) au-delà : végétation → exclu
    ndwi_min: -0.05          # (G-NIR)/(G+NIR) en dessous : pas un plan d'eau → exclu
  forme:
    # surface_min_m2 : CALIBRÉ B2-terrain 2026-07-11 sur Bouchemaine (49035, 286
    # piscines OSM connues) : avant 4 → après 8 (aligné sur le filtre qualité final,
    # donc SANS coût de rappel vendable — ces candidats seraient de toute façon
    # rejetés par 30_score). Effet mesuré : 2614→1615 candidats (ratio 9,1:1→5,6:1),
    # rappel 58,0%→54,5%.
    surface_min_m2: 8
    surface_max_m2: 400      # les cas limites pour le tri humain, 30_score retranche
    compacite_min: 0.30      # 4πA/P² : élimine les formes filandreuses (fossés, reflets)
    solidite_min: 0.65       # A/A_enveloppe_convexe : élimine les amas de bruit
  fenetre:
    taille_px: 2048          # fenêtre de lecture (borne la mémoire, dalle = 25 000² px)
    chevauchement_px: 128    # ≥ diamètre max d'une piscine (150 m² ⇒ ~14 m ⇒ 70 px à 20 cm)
  buffer_batiments_m: 80     # fenêtre sans bâtiment BD TOPO à <80 m : sautée (gain ~60 %)
  # score_min : CALIBRÉ B2-terrain 2026-07-11 sur Bouchemaine : avant 0,35 → après 0,55.
  # Objectif : faire repasser le ratio candidats/piscines-OSM sous le seuil d'alerte
  # de 4:1 (doc 10 §8, tri humain intenable au-delà à l'échelle département). Combiné
  # à surface_min_m2=8 : 2614→938 candidats, ratio 9,1:1→3,3:1, rappel 58,0%→53,5%.
  score_min: 0.55

terrasses:
  # Produit 2 (25_terrasses.py) — seuils de docs/05 §2 et §4. Les classes sont
  # à calibrer sur le terrain (validation docs/06, précision ≥ 90 % pour ce produit).
  dist_facade_m: 15          # la zone terrasse potentielle : ≤ 15 m de la façade
  tampon_limite_m: 1.0       # bande le long des limites de parcelle : exclue
  surface_zone_min_m2: 10    # zone jardin plus petite : pas un prospect pergola
  hauteur_sol_max_m: 0.5     # MNH au-delà : sursol (arbre, abri) — exclu du masque
  pas_minutes: 30            # échantillonnage de la journée solaire
  portee_ombre_m: 150        # au-delà, un obstacle n'ombrage plus (voir solaire.py)
  surface_contigue_min_m2: 20  # la classe exige une surface CONTIGUË qui la satisfait
  plein_soleil:              # > 7 h au 21 juin ET > 4 h à l'équinoxe (docs/05 §4)
    juin_min_h: 7
    equinoxe_min_h: 4
  bon:
    juin_min_h: 5
    equinoxe_min_h: 3

tri_visuel:
  vignette_m: 60             # côté du crop ortho centré sur la détection (mètres)
  vignette_px: 300           # résolution de la vignette PNG

export:
  rayon_defaut_km: 30
  confiances_vendues: ["haute", "moyenne"]  # la basse confiance ne sort jamais

backup:                      # 90_backup.py (docs/16 §2) — configuré le 2026-07-12
  chiffrement: age           # age (défaut) ou gpg — clé PUBLIQUE, pas de passphrase
  # Clé PUBLIQUE age (non secrète). La clé PRIVÉE correspondante est HORS repo :
  # ~/.config/maps-backup/age-key.txt — 🧑 EN GARDER UNE COPIE dans un gestionnaire de
  # mots de passe : sans elle, AUCUN backup n'est déchiffrable. Régénérer = age-keygen.
  destinataire: "age16q3mllugvr9n4hczrm0szddfq6j7xxlq30f0k8gw47qe4980w5zssvdnqt"
  # Destination rclone. Défaut = dossier LOCAL sur le disque externe NOIR (aucun compte
  # requis, marche tout de suite ; c'est un backup hors-disque-principal, PAS encore
  # hors-site). 🧑 pour l'off-site cloud : `rclone config` (créer un remote, ex. Hetzner
  # Storage Box / Backblaze B2), puis remplacer par "monremote:maps-backups".
  rclone_remote: "/Volumes/NOIR 1/maps-backups"
