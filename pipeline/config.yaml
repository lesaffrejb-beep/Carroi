# Configuration centrale du pipeline. Tout paramètre métier vit ici, pas dans le code.

dept: "49"                 # département cible (string, garde le zéro initial des DOM/Corse ailleurs)
crs_metric: "EPSG:2154"    # Lambert-93 : tous les calculs de surface/distance
crs_output: "EPSG:4326"    # WGS84 : lat/lon des exports

paths:
  raw: "data/raw"          # téléchargements bruts (gitignoré)
  interim: "data/interim"  # couches intermédiaires (parquet/gpkg)
  final: "data/final"      # base qualifiée interne
  exports: "data/exports"  # fichiers clients générés
  optout: "data/optout/optout.csv"   # adresses retirées (droit d'opposition) — filtre systématique
  validation: "data/validation"

piscines:
  # Filtres qualité — justifiés dans docs/06-QUALITE-VALIDATION.md.
  # Ajuster UNIQUEMENT après une passe de validation, et consigner l'ancien/nouveau dans 08-ROADMAP.md.
  surface_min_m2: 8
  surface_max_m2: 150
  dist_max_batiment_m: 60      # piscine sans bâtiment d'habitation à <60 m => exclue
  dist_max_adresse_m: 120      # adresse BAN retenue à plus de 120 m de la piscine => confiance basse
  chevauchement_parcelle_min: 0.6  # part min. de la piscine dans la parcelle retenue, sinon jointure ambiguë

detection:
  # Étape 1b (15_detect_piscines.py) — seuillage colorimétrique HSV + IRC, option B
  # de docs/04-PIPELINE-PISCINES.md. Seuils initiaux justifiés par la physique du
  # signal (eau de piscine = teinte cyan, forte absorption du proche infrarouge) ;
  # à calibrer sur la commune test (B2) et consigner tout changement dans 08-ROADMAP.md.
  hsv:
    hue_min: 0.42            # teinte (0-1) : fenêtre cyan-azur de l'eau traitée
    hue_max: 0.62
    sat_min: 0.15            # en dessous : gris/blanc (toits, routes)
    val_min: 0.25            # en dessous : ombres
  irc:
    band_nir: 1              # BD ORTHO IRC : bande 1 = proche infrarouge
    ndvi_max: 0.10           # (NIR-R)/(NIR+R) au-delà : végétation → exclu
    ndwi_min: -0.05          # (G-NIR)/(G+NIR) en dessous : pas un plan d'eau → exclu
  forme:
    surface_min_m2: 4        # plus lâche que le filtre qualité (8-150) : on garde
    surface_max_m2: 400      # les cas limites pour le tri humain, 30_score retranche
    compacite_min: 0.30      # 4πA/P² : élimine les formes filandreuses (fossés, reflets)
    solidite_min: 0.65       # A/A_enveloppe_convexe : élimine les amas de bruit
  fenetre:
    taille_px: 2048          # fenêtre de lecture (borne la mémoire, dalle = 25 000² px)
    chevauchement_px: 128    # ≥ diamètre max d'une piscine (150 m² ⇒ ~14 m ⇒ 70 px à 20 cm)
  buffer_batiments_m: 80     # fenêtre sans bâtiment BD TOPO à <80 m : sautée (gain ~60 %)
  score_min: 0.35            # score_detection minimal pour retenir un candidat

tri_visuel:
  vignette_m: 60             # côté du crop ortho centré sur la détection (mètres)
  vignette_px: 300           # résolution de la vignette PNG

export:
  rayon_defaut_km: 30
  confiances_vendues: ["haute", "moyenne"]  # la basse confiance ne sort jamais
